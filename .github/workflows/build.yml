name: Build Custom Debian Live ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install live-build and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build xorriso isolinux

      - name: Configure live-build and mirrors
        run: |
          chmod +x scripts/setup.sh
          sudo scripts/setup.sh

      - name: Add SSH package
        run: |
          mkdir -p config/package-lists
          echo "openssh-server" > config/package-lists/ssh.list.chroot
          sudo cp -r config/package-lists lb/config/ 2>/dev/null || true

      - name: Patch live-build to skip Contents-amd64.gz
        run: |
          chmod +x scripts/patch-contents.py
          sudo python3 scripts/patch-contents.py

      - name: Fix isolinux symlinks inside chroot (Ubuntu 24.04 path mismatch)
        run: |
          # Create chroot hook to fix broken isolinux symlinks
          # isolinux package puts files in /usr/lib/ISOLINUX/ but live-build expects /usr/lib/syslinux/
          sudo mkdir -p config/hooks/normal
          python3 - << 'PYEOF'
          hook = """#!/bin/sh
          # Fix isolinux.bin symlinks for Ubuntu 24.04
          set -e
          echo "Fix-isolinux: creating symlinks..."
          if [ -f /usr/lib/ISOLINUX/isolinux.bin ]; then
              mkdir -p /usr/lib/syslinux
              ln -sf /usr/lib/ISOLINUX/isolinux.bin /usr/lib/syslinux/isolinux.bin
              echo "  /usr/lib/syslinux/isolinux.bin -> /usr/lib/ISOLINUX/isolinux.bin"
          fi
          if [ -f /usr/lib/syslinux/modules/bios/vesamenu.c32 ]; then
              mkdir -p /usr/lib/syslinux
              ln -sf /usr/lib/syslinux/modules/bios/vesamenu.c32 /usr/lib/syslinux/vesamenu.c32
              echo "  /usr/lib/syslinux/vesamenu.c32 -> /usr/lib/syslinux/modules/bios/vesamenu.c32"
          fi
          echo "Fix-isolinux: done"
          """
          with open("config/hooks/normal/fix-isolinux.hook.chroot", "w") as f:
              f.write(hook)
          import os
          os.chmod("config/hooks/normal/fix-isolinux.hook.chroot", 0o755)
          print("Hook written")
          PYEOF
          ls -la config/hooks/normal/

      - name: Build ISO
        run: |
          sudo lb build 2>&1
          EXIT_CODE=$?
          echo "Build exit code: $EXIT_CODE"
          find . -name "*.iso" -ls 2>/dev/null || echo "No ISO found"
          exit $EXIT_CODE

      - name: Find ISO
        id: find-iso
        run: |
          ISO=$(find . -name "*.hybrid.iso" -o -name "*.iso" 2>/dev/null | grep -v "stage\|source" | head -1)
          echo "iso_path=$ISO" >> $GITHUB_OUTPUT
          echo "ISO=$ISO"

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        if: steps.find-iso.outputs.iso_path != ''
        with:
          name: custom-debian-live-amd64
          path: ${{ steps.find-iso.outputs.iso_path }}
          retention-days: 7
