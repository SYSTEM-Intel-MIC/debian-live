name: Build Custom Debian Live ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debian Live ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show disk space
        run: df -h /

      # ── 2. 配置 Debian Bookworm apt 源（用本地密钥，无外部下载）───
      - name: Setup Debian Bookworm sources with local keyring
        run: |
          # 清理旧的 Ubuntu 源
          sudo rm -f /etc/apt/sources.list
          sudo rm -f /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true

          # 把本地密钥安装到系统 keyring（apt 用）
          sudo mkdir -p /etc/apt/keyrings
          for keyring in \
            config/debian-archive-bookworm-automatic.gpg \
            config/debian-archive-bookworm-security-automatic.gpg \
            config/debian-archive-keyring.gpg; do
            if [ -f "$keyring" ]; then
              sudo cp "$keyring" /etc/apt/keyrings/$(basename "$keyring")
              echo "Installed to apt keyrings: $keyring"
            fi
          done

          # 把完整密钥复制到 debootstrap 需要的路径
          # debootstrap 读取 /usr/share/keyrings/debian-archive-keyring.gpg
          sudo cp config/debian-archive-keyring.gpg /usr/share/keyrings/debian-archive-keyring.gpg
          echo "Installed to debootstrap keyring: /usr/share/keyrings/debian-archive-keyring.gpg"

          # 写入 Bookworm sources.list（使用 signed-by 指向本地密钥）
          sudo tee /etc/apt/sources.list << 'EOF'
          deb [signed-by=/etc/apt/keyrings/debian-archive-bookworm-automatic.gpg] http://mirrors.aliyun.com/debian bookworm main contrib non-free non-free-firmware
          deb [signed-by=/etc/apt/keyrings/debian-archive-bookworm-security-automatic.gpg] http://mirrors.aliyun.com/debian-security bookworm-security main contrib non-free non-free-firmware
          EOF

          # 清理第三方源
          sudo rm -f /etc/apt/sources.list.d/*.list 2>/dev/null || true
          echo "=== sources.list ==="
          cat /etc/apt/sources.list

      # ── 3. 更新 apt + 安装依赖 ──────────────────────────────────
      - name: Update apt and install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            parted \
            dosfstools \
            gpg \
            2>&1 | tail -10
          lb --version

      # ── 4. 设置 auto 脚本权限（重要！否则被忽略）─────────────────
      - name: Make auto scripts executable
        run: |
          chmod +x auto/config auto/build auto/clean
          ls -la auto/

      # ── 5. 清理旧构建（只清理 lb 目录，不动 config/）────────────
      - name: Clean previous build artifacts
        run: |
          # 只清理 live-build 生成的文件，保留 config/（含密钥和镜像配置）
          sudo rm -rf lb/ .build/ stage/ cache/ *.iso *.log 2>/dev/null || true
          echo "Cleaned lb/, .build/, stage/, cache/"
          echo "config/ preserved:"
          find config -type f | sort

      # ── 6. 配置 live-build（通过 auto/config 脚本）──────────────
      - name: Configure live-build
        run: |
          # 让 auto/config 使用仓库中的配置
          sudo LB_AUTO_SRC=0 lb config 2>&1 | tail -10
          echo "=== lb config done ==="
          ls config/

      # ── 7. 确认镜像覆盖（lb config 可能已覆盖）──────────────────
      - name: Ensure mirror overrides are in place
        run: |
          MIRROR="http://mirrors.aliyun.com/debian"
          SECURITY="http://mirrors.aliyun.com/debian-security"

          append_if_missing() {
            local file="$1" key="$2" val="$3"
            grep -q "^${key}=" "$file" && \
              sudo sed -i "s|^${key}=.*|${key}=\"${val}\"|" "$file" || \
              echo "${key}=\"${val}\"" | sudo tee -a "$file"
          }

          append_if_missing config/bootstrap "LB_MIRROR_BOOTSTRAP" "http://deb.debian.org/debian"
          append_if_missing config/bootstrap "LB_PARENT_MIRROR_BOOTSTRAP" "http://deb.debian.org/debian"
          append_if_missing config/chroot "LB_MIRROR_CHROOT" "$MIRROR/"
          append_if_missing config/chroot "LB_PARENT_MIRROR_CHROOT" "$MIRROR/"
          append_if_missing config/binary "LB_MIRROR_BINARY" "$MIRROR/"
          append_if_missing config/binary "LB_PARENT_MIRROR_BINARY" "$MIRROR/"
          append_if_missing config/binary "LB_MIRROR_BINARY_SECURITY" "$SECURITY/"

          echo "=== Chroot mirrors ==="
          grep -E "^LB_.*MIRROR" config/chroot | grep -v "^#"

      # ── 8. 写入 archive override（阿里云镜像）───────────────────
      - name: Write archive override files
        run: |
          sudo mkdir -p config/archives

          cat | sudo tee config/archives/mirrors.list.chroot << 'EOF'
          deb http://mirrors.aliyun.com/debian bookworm main contrib non-free non-free-firmware
          deb http://mirrors.aliyun.com/debian-security bookworm-security main contrib non-free non-free-firmware
          EOF

          cat | sudo tee config/archives/mirrors.list.binary << 'EOF'
          deb http://mirrors.aliyun.com/debian bookworm main contrib non-free non-free-firmware
          deb http://mirrors.aliyun.com/debian-security bookworm-security main contrib non-free non-free-firmware
          EOF

          echo "=== Archives ==="
          ls config/archives/

      # ── 9. 添加 SSH 包 ─────────────────────────────────────────
      - name: Add SSH package
        run: |
          sudo mkdir -p config/package-lists
          echo "openssh-server" | sudo tee config/package-lists/ssh.list.chroot

      # ── 10. SSH hook ────────────────────────────────────────────
      - name: Add SSH hook
        run: |
          sudo mkdir -p config/hooks/live
          cat | sudo tee config/hooks/live/enable-ssh.hook.chroot << 'EOF'
          #!/bin/sh
          set -e
          sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sed -i 's/^#*PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
          echo "SSH configured"
          EOF
          sudo chmod +x config/hooks/live/enable-ssh.hook.chroot

      # ── 11. 构建 ISO ────────────────────────────────────────────
      - name: Build ISO
        id: build
        run: |
          set -o pipefail
          echo "Build started: $(date)"
          sudo lb build 2>&1 | tee build.log
          EXIT=$?
          echo "Build finished: $(date), exit=$EXIT"
          exit $EXIT

      # ── 12. 找 ISO ─────────────────────────────────────────────
      - name: Find ISO
        id: find-iso
        run: |
          ISO=$(find . -name "*.hybrid.iso" 2>/dev/null | grep -v stage | head -1)
          if [ -z "$ISO" ]; then
            ISO=$(find . -name "*.iso" 2>/dev/null | grep -v "stage\|source" | head -1)
          fi
          if [ -n "$ISO" ]; then
            echo "iso_path=$ISO" >> $GITHUB_OUTPUT
            echo "Found: $ISO"
            ls -lh "$ISO"
          else
            echo "No ISO found"
            echo "iso_path=" >> $GITHUB_OUTPUT
          fi

      # ── 13. 上传 artifact ───────────────────────────────────────
      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        if: steps.find-iso.outputs.iso_path != ''
        with:
          name: debian-live-${{ github.run_number }}
          path: ${{ steps.find-iso.outputs.iso_path }}
          retention-days: 7
          compression-level: 0

      # ── 14. 清理 ───────────────────────────────────────────────
      - name: Cleanup disk space
        if: always()
        run: |
          sudo rm -rf lb/ stage/ cache/ .build/ 2>/dev/null || true
          df -h /

  # ── 结果通知 ─────────────────────────────────────────────────
  notify:
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Build result
        run: |
          if [[ "${{ needs.build.result }}" == "success" ]]; then
            echo "✅ 构建成功！ISO 已上传到 Artifacts"
          else
            echo "❌ 构建失败，请查看上方日志"
            exit 1
          fi
