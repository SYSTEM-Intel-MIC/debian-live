name: Build Custom Debian Live ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install live-build and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build xorriso isolinux

      - name: Configure live-build and mirrors
        run: |
          chmod +x scripts/setup.sh
          sudo scripts/setup.sh

      - name: Copy real isolinux binaries to custom bootloaders dir
        run: |
          # Ubuntu 24.04: isolinux package puts isolinux.bin in /usr/lib/ISOLINUX/
          # vesamenu.c32 is in /usr/lib/syslinux/modules/bios/ (from syslinux-common)
          sudo mkdir -p config/bootloaders/isolinux
          sudo cp -L /usr/lib/ISOLINUX/isolinux.bin config/bootloaders/isolinux/
          sudo cp -L /usr/lib/syslinux/modules/bios/vesamenu.c32 config/bootloaders/isolinux/
          sudo cp -L /usr/lib/ISOLINUX/isohdpfx.bin config/bootloaders/isolinux/
          echo "=== Custom bootloaders ==="
          ls -la config/bootloaders/isolinux/

      - name: Add SSH package
        run: |
          mkdir -p config/package-lists
          echo "openssh-server" > config/package-lists/ssh.list.chroot
          sudo cp -r config/package-lists lb/config/ 2>/dev/null || true

      - name: Patch live-build to skip Contents-amd64.gz
        run: |
          chmod +x scripts/patch-contents.py
          sudo python3 scripts/patch-contents.py

      - name: Build ISO
        run: |
          sudo lb build 2>&1
          EXIT_CODE=$?
          echo "Build exit code: $EXIT_CODE"
          find . -name "*.iso" -ls 2>/dev/null || echo "No ISO found"
          exit $EXIT_CODE

      - name: Find ISO
        id: find-iso
        run: |
          ISO=$(find . -name "*.hybrid.iso" -o -name "*.iso" 2>/dev/null | grep -v "stage\|source" | head -1)
          echo "iso_path=$ISO" >> $GITHUB_OUTPUT
          echo "ISO=$ISO"

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        if: steps.find-iso.outputs.iso_path != ''
        with:
          name: custom-debian-live-amd64
          path: ${{ steps.find-iso.outputs.iso_path }}
          retention-days: 7
