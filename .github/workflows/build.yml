name: Build Custom Debian Live ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debian Live ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show disk space
        run: df -h /

      # ── 2. 配置 Debian Bookworm 源 + 导入密钥 ──────────────────
      - name: Setup Debian Bookworm apt sources
        run: |
          # 清理旧的 Ubuntu 源
          sudo rm -f /etc/apt/sources.list
          sudo rm -f /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true

          # 写入 Bookworm sources.list
          sudo tee /etc/apt/sources.list << 'EOF'
          deb http://mirrors.aliyun.com/debian bookworm main contrib non-free non-free-firmware
          deb http://mirrors.aliyun.com/debian-security bookworm-security main contrib non-free non-free-firmware
          EOF

          # 下载并安装 Debian Bookworm 归档密钥（解决 NO_PUBKEY 问题）
          wget -qO- https://ftp-master.metadata.org/ftp/distributions/Debian/repo/keyring/debian-archive-bookworm-automatic.asc \
            | gpg --dearmor -o /tmp/debian-archive-bookworm.gpg 2>/dev/null || \
          wget -qO- http://ftp.debian.org/debian/pool/main/d/debian-archive-keyring/debian-archive-keyring_2023.3_all.deb -o /tmp/keyring.deb

          # 尝试用 deb 包方式安装（最可靠）
          wget -q "http://ftp.debian.org/debian/pool/main/d/debian-archive-keyring/debian-archive-keyring_2023.3_all.deb" \
            -O /tmp/keyring.deb 2>/dev/null && \
            sudo dpkg -i /tmp/keyring.deb && echo "Keyring installed" || \
            echo "Keyring install failed, trying manual import"

          # 手动导入关键公钥（如果 deb 安装失败）
          for key in \
            "6ED0E7B82643E131" \
            "78DBA3BC47EF2265" \
            "F8D2585B8783D481" \
            "54404762BBB6E853" \
            "BDE6D2B9216EC7A8"; do
            sudo apt-key adv --keyserver keyserver.ubuntu.com --recv-keys "$key" 2>/dev/null || true
          done

          cat /etc/apt/sources.list

      # ── 3. 更新 apt + 安装依赖 ──────────────────────────────────
      - name: Install live-build and dependencies
        run: |
          sudo apt-get update -y || {
            # 备用：允许不安全仓库继续
            sudo apt-get update -y --allow-insecure-repositories || true
          }
          sudo apt-get install -y --no-install-recommends \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            parted \
            dosfstools \
            gpg \
            2>&1 | tail -10
          lb --version

      # ── 4. 清理旧构建 ───────────────────────────────────────────
      - name: Clean previous build artifacts
        run: |
          sudo rm -rf config/archives lb/ .build/ stage/ cache/ *.iso *.log 2>/dev/null || true
          chmod +x scripts/setup.sh

      # ── 5. 运行 live-build 配置 ────────────────────────────────
      - name: Configure live-build
        run: |
          sudo lb config \
            --distribution bookworm \
            --architectures amd64 \
            --linux-flavours amd64 \
            --bootappend-live "boot=live components splash" \
            --binary-images iso-hybrid \
            --source false \
            --zsync false \
            --firmware-chroot false \
            2>&1 | tail -5
          echo "=== lb config done ==="

      # ── 6. 覆盖镜像源变量 ───────────────────────────────────────
      - name: Configure mirrors in lb config files
        run: |
          MIRROR="http://mirrors.aliyun.com/debian"
          SECURITY="http://mirrors.aliyun.com/debian-security"

          # Bootstrap
          echo "LB_MIRROR_BOOTSTRAP=\"http://deb.debian.org/debian\"" | sudo tee -a config/bootstrap
          echo "LB_PARENT_MIRROR_BOOTSTRAP=\"http://deb.debian.org/debian\"" | sudo tee -a config/bootstrap

          # Chroot（阿里云）
          echo "LB_MIRROR_CHROOT=\"$MIRROR/\"" | sudo tee -a config/chroot
          echo "LB_PARENT_MIRROR_CHROOT=\"$MIRROR/\"" | sudo tee -a config/chroot

          # Binary（阿里云）
          echo "LB_MIRROR_BINARY=\"$MIRROR/\"" | sudo tee -a config/binary
          echo "LB_PARENT_MIRROR_BINARY=\"$MIRROR/\"" | sudo tee -a config/binary
          echo "LB_MIRROR_BINARY_SECURITY=\"$SECURITY/\"" | sudo tee -a config/binary

          echo "=== Chroot mirrors ==="
          grep -E "^LB_.*MIRROR" config/chroot | grep -v "^#"

      # ── 7. 写入 archive override 文件 ──────────────────────────
      - name: Write archive override files
        run: |
          sudo mkdir -p config/archives

          cat | sudo tee config/archives/mirrors.list.chroot << 'EOF'
          deb http://mirrors.aliyun.com/debian bookworm main contrib non-free non-free-firmware
          deb http://mirrors.aliyun.com/debian-security bookworm-security main contrib non-free non-free-firmware
          EOF

          cat | sudo tee config/archives/mirrors.list.binary << 'EOF'
          deb http://mirrors.aliyun.com/debian bookworm main contrib non-free non-free-firmware
          deb http://mirrors.aliyun.com/debian-security bookworm-security main contrib non-free non-free-firmware
          EOF

          echo "=== Archives ==="
          ls config/archives/

      # ── 8. 添加 SSH 包 ─────────────────────────────────────────
      - name: Add SSH package
        run: |
          sudo mkdir -p config/package-lists
          echo "openssh-server" | sudo tee config/package-lists/ssh.list.chroot

      # ── 9. SSH hook ─────────────────────────────────────────────
      - name: Add SSH enable hook
        run: |
          sudo mkdir -p config/hooks/live
          cat | sudo tee config/hooks/live/enable-ssh.hook.chroot << 'EOF'
          #!/bin/sh
          set -e
          sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sed -i 's/^#*PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
          echo "SSH configured"
          EOF
          sudo chmod +x config/hooks/live/enable-ssh.hook.chroot
          echo "Hook created"

      # ── 10. 构建 ISO ────────────────────────────────────────────
      - name: Build ISO
        id: build
        run: |
          set -o pipefail
          echo "Build started: $(date)"
          sudo lb build 2>&1 | tee build.log
          EXIT=$?
          echo "Build finished: $(date), exit=$EXIT"
          exit $EXIT

      # ── 11. 找 ISO ─────────────────────────────────────────────
      - name: Find ISO
        id: find-iso
        run: |
          ISO=$(find . -name "*.hybrid.iso" 2>/dev/null | grep -v stage | head -1)
          if [ -z "$ISO" ]; then
            ISO=$(find . -name "*.iso" 2>/dev/null | grep -v "stage\|source" | head -1)
          fi
          if [ -n "$ISO" ]; then
            echo "iso_path=$ISO" >> $GITHUB_OUTPUT
            echo "Found: $ISO"
            ls -lh "$ISO"
          else
            echo "No ISO found"
            find . -name "*.iso" 2>/dev/null
            echo "iso_path=" >> $GITHUB_OUTPUT
          fi

      # ── 12. 上传 artifact ───────────────────────────────────────
      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        if: steps.find-iso.outputs.iso_path != ''
        with:
          name: debian-live-${{ github.run_number }}
          path: ${{ steps.find-iso.outputs.iso_path }}
          retention-days: 7
          compression-level: 0

      # ── 13. 清理磁盘 ───────────────────────────────────────────
      - name: Cleanup disk space
        if: always()
        run: |
          sudo rm -rf lb/ stage/ cache/ .build/ 2>/dev/null || true
          df -h /

  # ── 构建结果通知 ─────────────────────────────────────────────
  notify:
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Build result
        run: |
          if [[ "${{ needs.build.result }}" == "success" ]]; then
            echo "✅ 构建成功！ISO 已上传到 Artifacts"
          else
            echo "❌ 构建失败，请查看上方日志排查"
            exit 1
          fi
