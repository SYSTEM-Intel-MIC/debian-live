---
name: Build Lindows Live ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lindows-live-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Lindows LiveCD and installer image
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show host capacity
        run: |
          df -h /
          free -h

      - name: Install live-build host tooling
        run: |
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          # GitHub-hosted runners occasionally stall on a transient Debian mirror
          # connection; fail fast and retry instead of consuming the whole job.
          sudo timeout 12m apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 update
          sudo timeout 12m apt-get install -y --no-install-recommends \
            live-build debootstrap debian-archive-keyring squashfs-tools xorriso grub-pc-bin \
            grub-efi-amd64-bin isolinux syslinux syslinux-common syslinux-utils mtools dosfstools gpg cpio jq
          lb --version
          docker --version

      - name: Build fixed Lindows component packages in Debian Bookworm
        run: |
          set -euxo pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            golang:1.24-bookworm \
            bash ./scripts/build-lindows-components.sh
          test -f artifacts/packages/elevende_3.5.1_amd64.deb
          test -f artifacts/packages/copilot-for-linux_1.0.0_amd64.deb
          test -f artifacts/packages/feedbackhub_1.0.0+lindows1_amd64.deb
          test -f artifacts/packages/SHA256SUMS
          ( cd artifacts/packages && sha256sum -c SHA256SUMS )

      - name: Stage local packages for the live chroot
        run: |
          set -euxo pipefail
          sudo rm -rf config/includes.chroot/opt/lindows/packages
          sudo mkdir -p config/includes.chroot/opt/lindows/packages
          sudo cp artifacts/packages/*.deb artifacts/packages/SHA256SUMS \
            config/includes.chroot/opt/lindows/packages/
          sudo chown -R root:root config/includes.chroot/opt/lindows/packages
          ls -lh config/includes.chroot/opt/lindows/packages

      - name: Configure Lindows live-build image
        run: |
          set -euxo pipefail
          sudo rm -rf lb .build stage cache auto *.iso build.log 2>/dev/null || true
          sudo lb config \
            --ignore-system-defaults \
            --mode debian \
            --initramfs live-boot \
            --initsystem systemd \
            --distribution bookworm \
            --architectures amd64 \
            --linux-packages linux-image \
            --archive-areas "main contrib non-free non-free-firmware" \
            --mirror-bootstrap "http://deb.debian.org/debian" \
            --parent-mirror-bootstrap "http://deb.debian.org/debian" \
            --mirror-chroot "http://deb.debian.org/debian" \
            --parent-mirror-chroot "http://deb.debian.org/debian" \
            --mirror-chroot-security "http://security.debian.org/debian-security" \
            --parent-mirror-chroot-security "http://security.debian.org/debian-security" \
            --mirror-binary "http://deb.debian.org/debian" \
            --parent-mirror-binary "http://deb.debian.org/debian" \
            --mirror-binary-security "http://security.debian.org/debian-security" \
            --parent-mirror-binary-security "http://security.debian.org/debian-security" \
            --security false \
            --mirror-debian-installer "http://deb.debian.org/debian" \
            --keyring-packages "debian-archive-keyring" \
            --binary-images iso-hybrid \
            --bootappend-live "boot=live components splash" \
            --iso-application "Lindows Live" \
            --iso-publisher "SYSTEM-Intel-MIC" \
            --iso-volume "Lindows 1.0" \
            --source false \
            --zsync false \
            --firmware-chroot false \
            --apt-recommends false \
            --debian-installer false

          sudo mkdir -p config/archives
          cat <<'EOF' | sudo tee config/archives/lindows.list.chroot
          deb http://deb.debian.org/debian bookworm main contrib non-free non-free-firmware
          deb http://security.debian.org/debian-security bookworm-security main contrib non-free non-free-firmware
          deb http://deb.debian.org/debian bookworm-updates main contrib non-free non-free-firmware
          EOF
          cat <<'EOF' | sudo tee config/archives/lindows.list.binary
          deb http://deb.debian.org/debian bookworm main contrib non-free non-free-firmware
          deb http://security.debian.org/debian-security bookworm-security main contrib non-free non-free-firmware
          EOF
          # live-build 3.x executes local chroot hooks from config/hooks/*.chroot.
          # The repository keeps numbered sources under config/hooks/normal, so
          # stage them into the actual execution directory before lb build.
          sudo mkdir -p config/hooks
          for hook in config/hooks/normal/*.hook.chroot; do
            target="config/hooks/$(basename "$hook" .hook.chroot).chroot"
            sudo cp -f "$hook" "$target"
          done
          sudo chmod 755 config/hooks/*.chroot \
            config/includes.chroot/usr/local/bin/lindows-installer \
            config/includes.chroot/usr/local/sbin/lindows-live-session-init \
            config/includes.chroot/usr/local/sbin/lindows-lightdm
          # Keep isolinux.bin and every COM32 runtime module from the same
          # syslinux package. In particular, isolinux.cfg -> vesamenu.c32
          # requires ldlinux.c32, libcom32.c32 and libutil.c32 at boot time.
          sudo cp -f /usr/lib/ISOLINUX/isolinux.bin config/bootloaders/isolinux/isolinux.bin
          sudo cp -f /usr/lib/syslinux/modules/bios/*.c32 config/bootloaders/isolinux/
          test -s config/bootloaders/isolinux/isolinux.bin
          test -s config/bootloaders/isolinux/ldlinux.c32
          test -s config/bootloaders/isolinux/libcom32.c32
          test -s config/bootloaders/isolinux/libutil.c32
          test -s config/bootloaders/isolinux/vesamenu.c32
          sudo find config -maxdepth 4 -type f -printf '%p\n' | sort | head -200

      - name: Build Lindows ISO
        run: |
          set -euxo pipefail
          echo "Lindows build started: $(date --iso-8601=seconds)" | tee build.log
          sudo lb build 2>&1 | tee -a build.log

          # live-build's Debian Bookworm syslinux mode creates the BIOS image
          # but does not add an EFI System Partition. Repack the same binary/
          # tree with a standalone GRUB x86_64 EFI executable so the ISO boots
          # on both legacy BIOS and UEFI firmware.
          ISO_SOURCE="$(find . -maxdepth 2 -type f \( -name '*Lindows*.iso' -o -name '*.hybrid.iso' \) | head -n1)"
          test -n "$ISO_SOURCE"
          EFI_WORK="$(mktemp -d)"
          EFI_CFG="$EFI_WORK/grub.cfg"
          EFI_BIN="$EFI_WORK/BOOTX64.EFI"
          EFI_IMG="$EFI_WORK/efi.img"
          cat > "$EFI_CFG" <<'EOF'
          set timeout=12
          set default=0
          insmod iso9660
          insmod search
          insmod linux
          insmod normal
          search --no-floppy --file --set=root /live/vmlinuz
          menuentry "Start Lindows Live" {
            linux /live/vmlinuz boot=live components splash
            initrd /live/initrd.img
          }
          menuentry "Lindows Live (safe graphics)" {
            linux /live/vmlinuz boot=live components splash nomodeset
            initrd /live/initrd.img
          }
          EOF
          grub-mkstandalone -O x86_64-efi -o "$EFI_BIN" \
            --modules="iso9660 search linux normal" \
            "boot/grub/grub.cfg=$EFI_CFG"
          truncate -s 16M "$EFI_IMG"
          sudo mkfs.vfat -F 16 "$EFI_IMG"
          mmd -i "$EFI_IMG" ::/EFI ::/EFI/BOOT
          mcopy -i "$EFI_IMG" "$EFI_BIN" ::/EFI/BOOT/BOOTX64.EFI
          REPACKED="${ISO_SOURCE}.dualboot"
          sudo xorriso -as mkisofs -r -J -V "LINDOWS 1.0" \
            -o "$REPACKED" \
            -b isolinux/isolinux.bin -c isolinux/boot.cat \
            -no-emul-boot -boot-load-size 4 -boot-info-table \
            -eltorito-alt-boot -e efi.img -no-emul-boot \
            -isohybrid-gpt-basdat binary "$EFI_IMG" 2>&1 | tee -a build.log
          mv "$REPACKED" "$ISO_SOURCE"
          rm -rf "$EFI_WORK"
          echo "Lindows dual BIOS/UEFI ISO finished: $(date --iso-8601=seconds)" | tee -a build.log

      - name: Verify Lindows ISO
        id: iso
        run: |
          set -euxo pipefail
          ISO_SOURCE="$(find . -maxdepth 2 -type f \( -name '*Lindows*.iso' -o -name '*.hybrid.iso' \) | head -n1)"
          test -n "$ISO_SOURCE"
          test -s "$ISO_SOURCE"
          ISO="Lindows-1.0-amd64-livecd.iso"
          mv "$ISO_SOURCE" "$ISO"
          test -s "$ISO"
          echo "iso_path=$ISO" >> "$GITHUB_OUTPUT"
          # Inspect the final ISO rather than trusting the live-build log.
          xorriso -indev "$ISO" -report_el_torito plain 2>&1 | tee iso-boot-report.txt
          BOOT_CHECK="$(mktemp -d)"
          xorriso -osirrox on -indev "$ISO" -extract /isolinux/ldlinux.c32 "$BOOT_CHECK/ldlinux.c32" >/dev/null 2>&1
          xorriso -osirrox on -indev "$ISO" -extract /isolinux/vesamenu.c32 "$BOOT_CHECK/vesamenu.c32" >/dev/null 2>&1
          xorriso -osirrox on -indev "$ISO" -extract /efi.img "$BOOT_CHECK/efi.img" >/dev/null 2>&1
          test -s "$BOOT_CHECK/ldlinux.c32"
          test -s "$BOOT_CHECK/vesamenu.c32"
          test -s "$BOOT_CHECK/efi.img"
          rm -rf "$BOOT_CHECK"
          grep -q -E 'El Torito boot img.*BIOS|El Torito boot img.*UEFI|EFI|efi.img|isolinux' iso-boot-report.txt
          sha256sum "$ISO" | tee Lindows-1.0-amd64-livecd.iso.sha256
          cat > Lindows-1.0-release-notes.md <<EOF
          # Lindows 1.0 — LiveCD with installer

          Build: ${GITHUB_RUN_NUMBER}
          Commit: ${GITHUB_SHA}

          This hybrid ISO includes the ElevenDE desktop, Lindows boot and installer branding,
          Chinese Fcitx5 input support, Firefox ESR, VLC, Image Viewer, PeaZip, and the
          bundled Windows-style system tools.

          Verify the ISO before writing it to USB:

          \`\`\`sh
          sha256sum -c Lindows-1.0-amd64-livecd.iso.sha256
          \`\`\`
          EOF
          ls -lh "$ISO" Lindows-1.0-amd64-livecd.iso.sha256 Lindows-1.0-release-notes.md build.log

      - name: Upload Lindows ISO and verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Lindows-1.0-amd64-livecd-with-installer-${{ github.run_number }}
          path: |
            ${{ steps.iso.outputs.iso_path }}
            Lindows-1.0-amd64-livecd.iso.sha256
            Lindows-1.0-release-notes.md
            build.log
            iso-boot-report.txt
            artifacts/packages/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload component package set
        uses: actions/upload-artifact@v4
        with:
          name: Lindows-1.0-component-packages-${{ github.run_number }}
          path: artifacts/packages/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish Lindows ISO to GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lindows-1.0-build-${{ github.run_number }}
          name: Lindows 1.0 Build ${{ github.run_number }}
          body_path: Lindows-1.0-release-notes.md
          prerelease: true
          files: |
            ${{ steps.iso.outputs.iso_path }}
            Lindows-1.0-amd64-livecd.iso.sha256
            Lindows-1.0-release-notes.md

      - name: Cleanup runner disk
        if: always()
        run: |
          sudo rm -rf lb .build stage cache artifacts/work 2>/dev/null || true
          df -h /
