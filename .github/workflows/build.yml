name: Build Custom Debian Live ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install live-build and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build xorriso

      - name: Configure live-build and mirrors
        run: |
          # 在同一个 bash 进程里：lb config 之后修复镜像配置
          bash -c '
            sudo lb config \
              --distribution bookworm \
              --architectures amd64 \
              --linux-flavours amd64 \
              --bootappend-live "boot=live components splash" \
              --binary-images iso-hybrid \
              --source false \
              --mode debian

            # 修复所有 config 文件里的 security 镜像
            # lb config 默认生成 http://security.debian.org/ (404)
            # 正确路径：http://security.debian.org/debian-security
            for f in config/bootstrap config/chroot config/binary; do
              sudo sed -i "s|LB_PARENT_MIRROR_CHROOT_SECURITY=\"http://security.debian.org/\"|LB_PARENT_MIRROR_CHROOT_SECURITY=\"http://security.debian.org/debian-security\"|g" \"$f\"
              sudo sed -i "s|LB_PARENT_MIRROR_BINARY_SECURITY=\"http://security.debian.org/\"|LB_PARENT_MIRROR_BINARY_SECURITY=\"http://security.debian.org/debian-security\"|g" \"$f\"
              sudo sed -i "s|LB_MIRROR_CHROOT_SECURITY=\"http://security.debian.org/\"|LB_MIRROR_CHROOT_SECURITY=\"http://security.debian.org/debian-security\"|g" \"$f\"
              sudo sed -i "s|LB_MIRROR_BINARY_SECURITY=\"http://security.debian.org/\"|LB_MIRROR_BINARY_SECURITY=\"http://security.debian.org/debian-security\"|g" \"$f\"
            done

            # 写入 archive override 文件（三阶段全部覆盖）
            sudo mkdir -p config/archives
            printf "deb http://deb.debian.org/debian bookworm main contrib non-free non-free-firmware\ndeb http://security.debian.org/debian-security bookworm-security main contrib non-free non-free-firmware\n" \
              | sudo tee config/archives/mirrors.binary.chroot > /dev/null
            cp config/archives/mirrors.binary.chroot config/archives/mirrors.binary.chroot.chroot
            cp config/archives/mirrors.binary.chroot config/archives/mirrors.binary.live

            echo "Done. Verifying security mirrors:"
            grep -h "SECURITY" config/bootstrap config/chroot config/binary | grep -v "^#" | grep -v "^$"
          '

      - name: Add SSH package
        run: |
          mkdir -p config/package-lists
          echo "openssh-server" > config/package-lists/ssh.list.chroot
          sudo cp -r config/package-lists lb/config/ 2>/dev/null || true

      - name: Build ISO
        run: |
          sudo lb build 2>&1
          EXIT_CODE=$?
          echo "Build exit code: $EXIT_CODE"
          find . -name "*.iso" -ls 2>/dev/null || echo "No ISO found"
          exit $EXIT_CODE

      - name: Find ISO
        id: find-iso
        run: |
          ISO=$(find . -name "*.hybrid.iso" -o -name "*.iso" 2>/dev/null | grep -v "stage\|source" | head -1)
          echo "iso_path=$ISO" >> $GITHUB_OUTPUT
          echo "ISO=$ISO"

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        if: steps.find-iso.outputs.iso_path != ''
        with:
          name: custom-debian-live-amd64
          path: ${{ steps.find-iso.outputs.iso_path }}
          retention-days: 7
