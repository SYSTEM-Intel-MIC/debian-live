name: Build Custom Debian Live ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install live-build and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build xorriso

      - name: Configure live-build and mirrors
        run: |
          chmod +x scripts/setup.sh
          sudo scripts/setup.sh

      - name: Add SSH package
        run: |
          mkdir -p config/package-lists
          echo "openssh-server" > config/package-lists/ssh.list.chroot
          sudo cp -r config/package-lists lb/config/ 2>/dev/null || true

      - name: Patch live-build: skip Contents-amd64.gz (Debian removed it, always 404)
        run: |
          SCRIPT="/usr/lib/live/build/lb_chroot_linux-image"
          python3 - << 'PYEOF'
          import re
          path = "/usr/lib/live/build/lb_chroot_linux-image"
          with open(path) as f:
              content = f.read()
          # 把 mkdir -p cache/contents.chroot 改成 mkdir + touch（空文件，awk 读出来为空，固件包列表为空）
          content = content.replace(
              "mkdir -p cache/contents.chroot",
              "mkdir -p cache/contents.chroot && touch cache/contents.chroot/contents.${LB_PARENT_DISTRIBUTION}.${LB_ARCHITECTURES}"
          )
          # 把 wget Contents 那一行注释掉
          content = re.sub(
              r'^(\s*)wget\s+\$\{WGET_OPTIONS\}\s+\$\{LB_PARENT_MIRROR_CHROOT\}/dists/\$\{LB_PARENT_DISTRIBUTION\}/Contents-\$\{LB_ARCHITECTURES\}\.gz.*$',
              r'\1# PATCHED (Contents-amd64.gz unavailable): \g<0>',
              content, flags=re.MULTILINE
          )
          content = re.sub(
              r'^(\s*)wget\s+\{WGET_OPTIONS\}\s+\$\{LB_MIRROR_CHROOT\}/dists/\$\{LB_DISTRIBUTION\}/Contents-\$\{LB_ARCHITECTURES\}\.gz.*$',
              r'\1# PATCHED (Contents-amd64.gz unavailable): \g<0>',
              content, flags=re.MULTILINE
          )
          with open(path, 'w') as f:
              f.write(content)
          print("Patched successfully")
          # 验证
          with open(path) as f:
              for i, line in enumerate(f, 1):
                  if 'PATCHED' in line or 'touch cache' in line:
                      print(f"  line {i}: {line.rstrip()}")
          PYEOF

      - name: Build ISO
        run: |
          sudo lb build 2>&1
          EXIT_CODE=$?
          echo "Build exit code: $EXIT_CODE"
          find . -name "*.iso" -ls 2>/dev/null || echo "No ISO found"
          exit $EXIT_CODE

      - name: Find ISO
        id: find-iso
        run: |
          ISO=$(find . -name "*.hybrid.iso" -o -name "*.iso" 2>/dev/null | grep -v "stage\|source" | head -1)
          echo "iso_path=$ISO" >> $GITHUB_OUTPUT
          echo "ISO=$ISO"

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        if: steps.find-iso.outputs.iso_path != ''
        with:
          name: custom-debian-live-amd64
          path: ${{ steps.find-iso.outputs.iso_path }}
          retention-days: 7
