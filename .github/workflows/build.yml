name: Build Custom Debian Live ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install live-build and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build xorriso

      - name: Configure live-build
        run: |
          # 不依赖 auto/ 脚本，直接在 workflow 里配置
          sudo lb config \
            --distribution bookworm \
            --architectures amd64 \
            --linux-flavours amd64 \
            --bootappend-live "boot=live components splash" \
            --binary-images iso-hybrid \
            --source false

      - name: Configure apt mirrors
        run: |
          # 镜像配置（GitHub Actions 节点可访问的源）
          # 中国节点改为阿里云/清华源
          sudo mkdir -p lb/config/archives

          printf 'deb http://deb.debian.org/debian bookworm main contrib non-free non-free-firmware\ndeb http://security.debian.org/debian-security bookworm-security main contrib non-free non-free-firmware\n' \
            | sudo tee lb/config/archives/mirrors.binary.chroot > /dev/null

          sudo cp lb/config/archives/mirrors.binary.chroot lb/config/archives/mirrors.binary.chroot.chroot
          sudo cp lb/config/archives/mirrors.binary.chroot lb/config/archives/mirrors.binary.live

      - name: Add SSH package
        run: |
          mkdir -p config/package-lists
          echo "openssh-server" > config/package-lists/ssh.list.chroot
          sudo cp -r config/package-lists lb/config/

      - name: Build ISO
        run: |
          # 直接运行构建命令，保留所有输出
          sudo lb build --debug 2>&1
          EXIT_CODE=$?
          echo "Build exit code: $EXIT_CODE"
          echo ""
          echo "=== Files in current directory ==="
          ls -lh
          echo ""
          echo "=== ISO files ==="
          find . -name "*.iso" -ls 2>/dev/null || echo "No ISO found"
          exit $EXIT_CODE

      - name: Find ISO
        id: find-iso
        run: |
          ISO=$(find . -name "*.hybrid.iso" -o -name "*.iso" 2>/dev/null | grep -v "stage\|source" | grep -v "chroot" | head -1)
          echo "iso_path=$ISO" >> $GITHUB_OUTPUT
          echo "ISO=$ISO"
          if [ -z "$ISO" ]; then
            echo "No ISO found in current directory"
            find . -type f -name "*.iso" 2>/dev/null
            ls -la *.iso 2>/dev/null || echo "No iso files"
          fi

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        if: steps.find-iso.outputs.iso_path != ''
        with:
          name: custom-debian-live-amd64
          path: ${{ steps.find-iso.outputs.iso_path }}
          retention-days: 7
