name: Build Custom Debian Live ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install live-build and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build xorriso

      - name: Configure live-build and mirrors
        run: |
          # 在同一个 bash 进程里执行：lb config 之后立即写入 archives
          bash -c '
            sudo lb config \
              --distribution bookworm \
              --architectures amd64 \
              --linux-flavours amd64 \
              --bootappend-live "boot=live components splash" \
              --binary-images iso-hybrid \
              --source false \
              --mode debian

            # lb config 完成后立即写入 archives 覆盖镜像
            # 路径是 config/archives/（lb config 生成的目录），不是 lb/config/archives/
            sudo mkdir -p config/archives

            sudo tee config/archives/mirrors.binary.chroot > /dev/null << '\''EOF'\''
          deb http://deb.debian.org/debian bookworm main contrib non-free non-free-firmware
          deb http://security.debian.org/debian-security bookworm-security main contrib non-free non-free-firmware
          EOF

            sudo tee config/archives/mirrors.binary.chroot.chroot > /dev/null << '\''EOF'\''
          deb http://deb.debian.org/debian bookworm main contrib non-free non-free-firmware
          deb http://security.debian.org/debian-security bookworm-security main contrib non-free non-free-firmware
          EOF

            sudo tee config/archives/mirrors.binary.live > /dev/null << '\''EOF'\''
          deb http://deb.debian.org/debian bookworm main contrib non-free non-free-firmware
          deb http://security.debian.org/debian-security bookworm-security main contrib non-free non-free-firmware
          EOF

            echo "Archives written:"
            ls -la config/archives/
          '

      - name: Add SSH package
        run: |
          mkdir -p config/package-lists
          echo "openssh-server" > config/package-lists/ssh.list.chroot
          sudo cp -r config/package-lists lb/config/ 2>/dev/null || true

      - name: Build ISO
        run: |
          sudo lb build 2>&1
          EXIT_CODE=$?
          echo "Build exit code: $EXIT_CODE"
          find . -name "*.iso" -ls 2>/dev/null || echo "No ISO found"
          exit $EXIT_CODE

      - name: Find ISO
        id: find-iso
        run: |
          ISO=$(find . -name "*.hybrid.iso" -o -name "*.iso" 2>/dev/null | grep -v "stage\|source" | head -1)
          echo "iso_path=$ISO" >> $GITHUB_OUTPUT
          echo "ISO=$ISO"

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        if: steps.find-iso.outputs.iso_path != ''
        with:
          name: custom-debian-live-amd64
          path: ${{ steps.find-iso.outputs.iso_path }}
          retention-days: 7
