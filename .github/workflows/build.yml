name: Build Custom Debian Live ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install live-build and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build xorriso

      - name: Configure live-build and mirrors
        run: |
          chmod +x scripts/setup.sh
          sudo scripts/setup.sh

      - name: Pre-create fake Contents cache (Debian removed Contents-amd64.gz from mirrors)
        run: |
          # lb_chroot_linux-image 在 LB_FIRMWARE_CHROOT=true 时下载 Contents-amd64.gz
          # 直接预建缓存目录 + 空文件，让 wget 认为已下载（-C - 续传模式会跳过已有文件）
          sudo mkdir -p cache/contents.chroot
          # 创建一个空的但格式正确的 Contents 文件（裸 grep 不会匹配到任何固件行，即空结果）
          touch cache/contents.chroot/contents.bookworm.amd64
          echo "=== 预建缓存文件 ==="
          ls -la cache/contents.chroot/

      - name: Add SSH package
        run: |
          mkdir -p config/package-lists
          echo "openssh-server" > config/package-lists/ssh.list.chroot
          sudo cp -r config/package-lists lb/config/ 2>/dev/null || true

      - name: Build ISO
        run: |
          sudo lb build 2>&1
          EXIT_CODE=$?
          echo "Build exit code: $EXIT_CODE"
          find . -name "*.iso" -ls 2>/dev/null || echo "No ISO found"
          exit $EXIT_CODE

      - name: Find ISO
        id: find-iso
        run: |
          ISO=$(find . -name "*.hybrid.iso" -o -name "*.iso" 2>/dev/null | grep -v "stage\|source" | head -1)
          echo "iso_path=$ISO" >> $GITHUB_OUTPUT
          echo "ISO=$ISO"

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        if: steps.find-iso.outputs.iso_path != ''
        with:
          name: custom-debian-live-amd64
          path: ${{ steps.find-iso.outputs.iso_path }}
          retention-days: 7
