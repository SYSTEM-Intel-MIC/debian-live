name: Build Custom Debian Live ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install live-build and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build xorriso

      - name: Configure live-build
        run: |
          # 强制使用 Debian 模式
          sudo lb config \
            --distribution bookworm \
            --architectures amd64 \
            --linux-flavours amd64 \
            --bootappend-live "boot=live components splash" \
            --binary-images iso-hybrid \
            --source false \
            --mode debian

          # 直接修改 bootstrap 配置，修复 security 镜像路径
          # lb config 生成的默认值是 http://security.debian.org/debian-security bookworm/updates（404）
          # 正确路径：http://security.debian.org/debian-security bookworm-security main（非 bookworm/updates）
          sudo sed -i 's|http://security.debian.org/debian-security bookworm/updates|http://security.debian.org/debian-security bookworm-security main|g' config/bootstrap
          sudo sed -i 's|http://security.debian.org/debian-security bookworm/updates|http://security.debian.org/debian-security bookworm-security main|g' config/chroot
          sudo sed -i 's|http://security.debian.org/debian-security bookworm/updates|http://security.debian.org/debian-security bookworm-security main|g' config/binary

          # 同时写入 archive 文件（三阶段全部覆盖）
          sudo tee lb/config/archives/mirrors.binary.chroot > /dev/null << 'EOF'
          deb http://deb.debian.org/debian bookworm main contrib non-free non-free-firmware
          deb http://security.debian.org/debian-security bookworm-security main contrib non-free non-free-firmware
          EOF
          sudo tee lb/config/archives/mirrors.binary.chroot.chroot > /dev/null << 'EOF'
          deb http://deb.debian.org/debian bookworm main contrib non-free non-free-firmware
          deb http://security.debian.org/debian-security bookworm-security main contrib non-free non-free-firmware
          EOF
          sudo tee lb/config/archives/mirrors.binary.live > /dev/null << 'EOF'
          deb http://deb.debian.org/debian bookworm main contrib non-free non-free-firmware
          deb http://security.debian.org/debian-security bookworm-security main contrib non-free non-free-firmware
          EOF

      - name: Add SSH package
        run: |
          mkdir -p config/package-lists
          echo "openssh-server" > config/package-lists/ssh.list.chroot
          sudo cp -r config/package-lists lb/config/

      - name: Build ISO
        run: |
          sudo lb build --debug 2>&1
          EXIT_CODE=$?
          echo "Build exit code: $EXIT_CODE"
          echo "=== ISO files ==="
          find . -name "*.iso" -ls 2>/dev/null || echo "No ISO found"
          exit $EXIT_CODE

      - name: Find ISO
        id: find-iso
        run: |
          ISO=$(find . -name "*.hybrid.iso" -o -name "*.iso" 2>/dev/null | grep -v "stage\|source" | head -1)
          echo "iso_path=$ISO" >> $GITHUB_OUTPUT
          echo "ISO=$ISO"
          if [ -z "$ISO" ]; then
            echo "No ISO found"
          fi

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        if: steps.find-iso.outputs.iso_path != ''
        with:
          name: custom-debian-live-amd64
          path: ${{ steps.find-iso.outputs.iso_path }}
          retention-days: 7
