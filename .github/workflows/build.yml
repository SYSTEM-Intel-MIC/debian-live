name: Build Custom Debian Live ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install live-build
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build

      - name: Generate live-build config
        run: |
          sudo lb config \
            --distribution bookworm \
            --architectures amd64 \
            --linux-flavours amd64 \
            --bootappend-live "boot=live components splash" \
            --binary-images iso-hybrid \
            --source false

      - name: Override apt mirrors to Aliyun + Tsinghua (for local builds)
        run: |
          # 仅在本地构建时生效（GitHub Actions 节点在中国镜像访问受限）
          # 如需在中国节点构建，请取消注释下面的源配置

          # MIRROR="http://mirrors.aliyun.com/debian/"
          # SECURITY="http://mirrors.aliyun.com/debian-security/"
          #
          # sudo mkdir -p lb/config/archives
          # printf 'deb %s bookworm main contrib non-free non-free-firmware\ndeb %s bookworm-security main contrib non-free non-free-firmware\n' \
          #   "$MIRROR" "$SECURITY" | sudo tee lb/config/archives/mirrors.binary.chroot > /dev/null
          # cp lb/config/archives/mirrors.binary.chroot lb/config/archives/mirrors.binary.chroot.chroot
          # cp lb/config/archives/mirrors.binary.chroot lb/config/archives/mirrors.binary.live
          echo "Using default Debian mirrors (GitHub Actions runner accessible)"

      - name: Add SSH package list
        run: |
          mkdir -p config/package-lists
          echo "openssh-server" > config/package-lists/ssh.list.chroot

      - name: Copy repo config into live-build tree
        run: |
          sudo cp -r config/package-lists lb/config/ 2>/dev/null || true

      - name: Build the ISO
        run: |
          # 不用 tail，全部日志都保留，方便调试
          sudo lb build
          echo "--- Build exit code: $? ---"

      - name: Find ISO artifact
        id: find-iso
        run: |
          # 查找 ISO 文件（多种命名方式）
          ISO=$(find . -name "*.hybrid.iso" -o -name "*.iso" | grep -v "stage\|source" | head -1)
          echo "iso_path=$ISO" >> $GITHUB_OUTPUT
          echo "Found ISO: $ISO"
          if [ -z "$ISO" ]; then
            echo "ERROR: No ISO file found!"
            echo "Contents of current directory:"
            ls -lh
            echo "Contents of chroot stage:"
            ls -lh chroot 2>/dev/null || echo "(chroot dir not found)"
          fi

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        if: steps.find-iso.outputs.iso_path != ''
        with:
          name: custom-debian-live-amd64
          path: ${{ steps.find-iso.outputs.iso_path }}
          retention-days: 7
